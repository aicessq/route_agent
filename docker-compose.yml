services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: route_agent
      MYSQL_USER: route_agent
      MYSQL_PASSWORD: route_agent
      MYSQL_ROOT_PASSWORD: local_root_only
    ports:
      - "3307:3306"
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    volumes:
      - route_agent_mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    volumes:
      - route_agent_es:/usr/share/elasticsearch/data

volumes:
  route_agent_mysql:
  route_agent_es:
